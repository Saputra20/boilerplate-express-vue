tags:
  - name: Me
schemas:
  MeV1User:
    type: object
    required:
      - id
      - email
    additionalProperties: false
    properties:
      id:
        type: string
        format: uuid
      email:
        type: string
        format: email
  MeV1Response:
    type: object
    required:
      - user
      - roles
      - permissions
    additionalProperties: false
    properties:
      user:
        $ref: '#/components/schemas/MeV1User'
      roles:
        type: array
        items:
          type: string
      permissions:
        type: array
        items:
          type: string
paths:
  /api/v1/me:
    get:
      tags:
        - Me
      operationId: getAuthenticatedUserContext
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user and effective RBAC context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeV1Response'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
