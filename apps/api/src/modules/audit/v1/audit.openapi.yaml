tags:
  - name: Audit Trail
schemas:
  AuditV1Actor:
    type: object
    required: [type, available, id, displayName, email]
    additionalProperties: false
    properties:
      type: { type: string, enum: [user, system] }
      available: { type: boolean }
      id: { type: string, format: uuid, nullable: true }
      displayName: { type: string, nullable: true }
      email: { type: string, format: email, nullable: true }
  AuditV1Resource:
    type: object
    required: [type, id]
    additionalProperties: false
    properties:
      type: { type: string, nullable: true }
      id: { type: string, nullable: true }
  AuditV1Item:
    type: object
    required: [id, eventType, label, actor, resource, outcome, createdAt]
    additionalProperties: false
    properties:
      id: { type: string, format: uuid }
      eventType:
        type: string
        enum:
          - category.created
          - category.updated
          - category.deleted
          - role.created
          - role.updated
          - role.deleted
          - user.created
          - user.updated
          - user.deleted
          - user.profile_updated
          - audit.exported
      label: { type: string }
      actor: { $ref: '#/components/schemas/AuditV1Actor' }
      resource: { $ref: '#/components/schemas/AuditV1Resource' }
      outcome: { type: string, enum: [success, failure] }
      createdAt: { type: string, format: date-time }
  AuditV1Changes:
    type: object
    required: [available, before, after]
    additionalProperties: false
    properties:
      available: { type: boolean }
      before:
        type: object
        nullable: true
        additionalProperties: false
        properties:
          name: { type: string }
          slug: { type: string }
          description: { type: string, nullable: true }
          isActive: { type: boolean }
          code: { type: string }
          permissionCodes: { type: array, items: { type: string } }
          email: { type: string, format: email }
          roleId: { type: string, format: uuid, nullable: true }
          status: { type: string, enum: [active, disabled] }
          displayName: { type: string, nullable: true }
      after:
        type: object
        nullable: true
        additionalProperties: false
        properties:
          name: { type: string }
          slug: { type: string }
          description: { type: string, nullable: true }
          isActive: { type: boolean }
          code: { type: string }
          permissionCodes: { type: array, items: { type: string } }
          email: { type: string, format: email }
          roleId: { type: string, format: uuid, nullable: true }
          status: { type: string, enum: [active, disabled] }
          displayName: { type: string, nullable: true }
  AuditV1ExportFilters:
    type: object
    required: [action, actorId, resourceType, resourceId, outcome]
    additionalProperties: false
    properties:
      action:
        type: string
        enum:
          - category.created
          - category.updated
          - category.deleted
          - role.created
          - role.updated
          - role.deleted
          - user.created
          - user.updated
          - user.deleted
          - user.profile_updated
          - audit.exported
        nullable: true
      actorId: { type: string, format: uuid, nullable: true }
      resourceType:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'
        maxLength: 64
        nullable: true
      resourceId: { type: string, minLength: 1, maxLength: 255, nullable: true }
      outcome: { type: string, enum: [success, failure], nullable: true }
  AuditV1ExportSummary:
    type: object
    required: [rowCount, from, to, filters, searchApplied]
    additionalProperties: false
    properties:
      rowCount: { type: integer, minimum: 0, maximum: 10000 }
      from: { type: string, format: date-time }
      to: { type: string, format: date-time }
      filters: { $ref: '#/components/schemas/AuditV1ExportFilters' }
      searchApplied: { type: boolean }
  AuditV1Detail:
    type: object
    required: [id, eventType, label, actor, resource, outcome, createdAt, requestId]
    additionalProperties: false
    properties:
      id: { type: string, format: uuid }
      eventType:
        type: string
        enum:
          - category.created
          - category.updated
          - category.deleted
          - role.created
          - role.updated
          - role.deleted
          - user.created
          - user.updated
          - user.deleted
          - user.profile_updated
          - audit.exported
      label: { type: string }
      actor: { $ref: '#/components/schemas/AuditV1Actor' }
      resource: { $ref: '#/components/schemas/AuditV1Resource' }
      outcome: { type: string, enum: [success, failure] }
      createdAt: { type: string, format: date-time }
      requestId: { type: string, format: uuid, nullable: true }
      changes: { $ref: '#/components/schemas/AuditV1Changes' }
      exportSummary: { $ref: '#/components/schemas/AuditV1ExportSummary' }
  AuditV1ListResponse:
    type: object
    required: [items, pagination]
    additionalProperties: false
    properties:
      items:
        type: array
        items: { $ref: '#/components/schemas/AuditV1Item' }
      pagination:
        type: object
        required: [limit, nextCursor]
        additionalProperties: false
        properties:
          limit: { type: integer, enum: [10, 20, 50, 100] }
          nextCursor: { type: string, nullable: true }
paths:
  /api/v1/audit-events:
    get:
      tags: [Audit Trail]
      operationId: listAuditEvents
      description: Lists approved catalog events in createdAt DESC and id DESC order. Browsing defaults to the last 30 days and accepts submitted ranges up to 90 days. Page size is 10, 20, 50, or 100.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          description: Defaults to the last 30 days ending at request time when omitted. Submitted list span must be at most 90 days.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Defaults to request time when omitted. Submitted list span must be at most 90 days.
          schema: { type: string, format: date-time }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema:
            type: string
            enum:
              - category.created
              - category.updated
              - category.deleted
              - role.created
              - role.updated
              - role.deleted
              - user.created
              - user.updated
              - user.deleted
              - user.profile_updated
              - audit.exported
        - name: resourceType
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 64 }
        - name: resourceId
          in: query
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure] }
        - name: q
          in: query
          schema: { type: string, minLength: 2, maxLength: 120 }
        - name: limit
          in: query
          schema: { type: integer, enum: [10, 20, 50, 100], default: 10 }
        - name: cursor
          in: query
          description: Opaque base64url cursor over createdAt DESC and id DESC. Invalid cursors receive 400.
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Audit event list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditV1ListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/audit-events/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Audit Trail]
      operationId: getAuditEvent
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Audit event detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditV1Detail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/audit-events/export:
    get:
      tags: [Audit Trail]
      operationId: exportAuditEvents
      description: Streams approved catalog events as UTF-8 CSV. Export spans are limited to 31 days and 10,000 rows.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: from
          in: query
          description: Defaults to the last 30 days ending at request time when omitted. Submitted export span must be at most 31 days.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Defaults to request time when omitted. Submitted export span must be at most 31 days.
          schema: { type: string, format: date-time }
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema:
            type: string
            enum:
              - category.created
              - category.updated
              - category.deleted
              - role.created
              - role.updated
              - role.deleted
              - user.created
              - user.updated
              - user.deleted
              - user.profile_updated
              - audit.exported
        - name: resourceType
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9_]*$', maxLength: 64 }
        - name: resourceId
          in: query
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure] }
        - name: q
          in: query
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: UTF-8 CSV audit export
          content:
            text/csv: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
