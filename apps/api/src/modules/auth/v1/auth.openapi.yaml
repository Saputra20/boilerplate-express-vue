tags:
  - name: Auth
schemas:
  AuthV1LoginRequest:
    type: object
    required:
      - email
      - password
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
      password:
        type: string
        format: password
  AuthV1RefreshRequest:
    type: object
    required:
      - refreshToken
    additionalProperties: false
    properties:
      refreshToken:
        type: string
  AuthV1LoginResponse:
    type: object
    additionalProperties: false
    required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      tokenType:
        type: string
        enum:
          - Bearer
      expiresIn:
        type: integer
        minimum: 0
      mustChangePassword:
        type: boolean
  AuthV1RefreshResponse:
    type: object
    required: [accessToken, refreshToken, tokenType, expiresIn]
    additionalProperties: false
    properties:
      accessToken: { type: string }
      refreshToken: { type: string }
      tokenType: { type: string, enum: [Bearer] }
      expiresIn: { type: integer, minimum: 0 }
  AuthV1PasswordChangeRequest:
    type: object
    required: [currentPassword, newPassword]
    additionalProperties: false
    properties:
      currentPassword: { type: string, format: password }
      newPassword:
        type: string
        format: password
        minLength: 12
        maxLength: 128
        description: Length is counted in Unicode code points; the server does not trim or normalize it.
  AuthV1EmailVerificationRequest:
    type: object
    required: [email]
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
  AuthV1EmailVerificationTokenRequest:
    type: object
    required: [token]
    additionalProperties: false
    properties:
      token:
        type: string
  AuthV1PasswordRecoveryRequest:
    type: object
    required: [email]
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
  AuthV1PasswordResetConfirmRequest:
    type: object
    required: [token, password]
    additionalProperties: false
    properties:
      token:
        type: string
      password:
        type: string
        format: password
        minLength: 12
        maxLength: 128
  AuthV1MessageResponse:
    type: object
    required: [message]
    properties:
      message:
        type: string
  AuthV1PasswordChangeError:
    type: object
    required: [message, code]
    additionalProperties: false
    properties:
      message: { type: string }
      code:
        type: string
        enum:
          - invalid_current_password
          - password_policy_violation
          - password_unchanged
  AuthV1PasswordChangeConflict:
    type: object
    required: [message, code]
    additionalProperties: false
    properties:
      message: { type: string }
      code: { type: string, enum: [password_change_not_required] }
  AuthV1SelfServicePasswordChangeRequest:
    type: object
    required: [currentPassword, newPassword]
    additionalProperties: false
    properties:
      currentPassword: { type: string, format: password }
      newPassword:
        type: string
        format: password
        minLength: 12
        maxLength: 128
        description: Length is counted in Unicode code points; the server does not trim or normalize it.
  AuthV1PasswordChangeRequired:
    type: object
    required: [message, code]
    additionalProperties: false
    properties:
      message: { type: string }
      code: { type: string, enum: [password_change_required] }
paths:
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1PasswordRecoveryRequest'
      responses:
        '202':
          description: Generic response that does not disclose account eligibility or delivery outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password reset completed and all active sessions revoked
        '400':
          description: Malformed request, password policy failure, or invalid/expired/used reset token
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum: [invalid_or_expired_password_reset_token]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/email-verification/request:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1EmailVerificationRequest'
      responses:
        '202':
          description: Generic response that does not disclose account eligibility or delivery outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/email-verification/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1EmailVerificationTokenRequest'
      responses:
        '200':
          description: Email address verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1MessageResponse'
        '400':
          description: Invalid, used, revoked, or expired verification token
          content:
            application/json:
              schema:
                type: object
                required: [message, code]
                properties:
                  message: { type: string }
                  code:
                    type: string
                    enum: [invalid_or_used_verification_token, verification_token_expired]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1RefreshRequest'
      responses:
        '200':
          description: Rotated session tokens only. The database-backed password-change requirement is unchanged and is rehydrated through GET /api/v1/me.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1RefreshResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      operationId: changeFirstLoginPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; the current session and refresh token remain active.
        '400':
          description: Invalid current password, password policy violation, unchanged password, or malformed body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthV1PasswordChangeError'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The authenticated user is no longer required to change their password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1PasswordChangeConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/change-password/self-service:
    post:
      tags: [Auth]
      operationId: changeCurrentUserPassword
      summary: Change the authenticated user's password voluntarily
      description: Requires the current password. Available only when the user is not required to change their password on first login. The current session remains active and other active sessions are revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1SelfServicePasswordChangeRequest'
      responses:
        '204':
          description: Password changed; the current session and refresh-token chain remain active and other active sessions are revoked.
        '400':
          description: Invalid current password, password policy violation, unchanged password, or malformed body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthV1PasswordChangeError'
                  - $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The authenticated user is still required to change their password on first login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1PasswordChangeRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutCurrentSession
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Auth
      operationId: logoutAllSessions
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All user sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
