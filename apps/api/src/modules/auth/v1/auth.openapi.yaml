tags:
  - name: Auth
schemas:
  AuthV1LoginRequest:
    type: object
    required:
      - email
      - password
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
      password:
        type: string
        format: password
  AuthV1RefreshRequest:
    type: object
    required:
      - refreshToken
    additionalProperties: false
    properties:
      refreshToken:
        type: string
  AuthV1TokenResponse:
    type: object
    required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      tokenType:
        type: string
        enum:
          - Bearer
      expiresIn:
        type: integer
        minimum: 0
      mustChangePassword:
        type: boolean
  AuthV1EmailVerificationRequest:
    type: object
    required: [email]
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
  AuthV1EmailVerificationTokenRequest:
    type: object
    required: [token]
    additionalProperties: false
    properties:
      token:
        type: string
  AuthV1PasswordRecoveryRequest:
    type: object
    required: [email]
    additionalProperties: false
    properties:
      email:
        type: string
        format: email
  AuthV1PasswordResetConfirmRequest:
    type: object
    required: [token, password]
    additionalProperties: false
    properties:
      token:
        type: string
      password:
        type: string
        format: password
        minLength: 12
        maxLength: 128
  AuthV1MessageResponse:
    type: object
    required: [message]
    properties:
      message:
        type: string
paths:
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1PasswordRecoveryRequest'
      responses:
        '202':
          description: Generic response that does not disclose account eligibility or delivery outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Auth]
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password reset completed and all active sessions revoked
        '400':
          description: Malformed request, password policy failure, or invalid/expired/used reset token
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    enum: [invalid_or_expired_password_reset_token]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/email-verification/request:
    post:
      tags: [Auth]
      operationId: requestEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1EmailVerificationRequest'
      responses:
        '202':
          description: Generic response that does not disclose account eligibility or delivery outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/email-verification/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1EmailVerificationTokenRequest'
      responses:
        '200':
          description: Email address verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1MessageResponse'
        '400':
          description: Invalid, used, revoked, or expired verification token
          content:
            application/json:
              schema:
                type: object
                required: [message, code]
                properties:
                  message: { type: string }
                  code:
                    type: string
                    enum: [invalid_or_used_verification_token, verification_token_expired]
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1LoginRequest'
      responses:
        '200':
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthV1RefreshRequest'
      responses:
        '200':
          description: Rotated session tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthV1TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutCurrentSession
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Auth
      operationId: logoutAllSessions
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All user sessions revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
